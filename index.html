<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>GameFlash - Noticias y especiales gaming</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b0c0e;
            color: #ffffff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100%;
            -webkit-font-smoothing: antialiased;
        }

        .feed-container {
            height: 100vh;
            height: 100dvh;
            width: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
            -ms-overflow-style: none;
            scroll-behavior: smooth;
        }

        .feed-container::-webkit-scrollbar {
            display: none;
        }

        .news-card {
            height: 100vh;
            height: 100dvh;
            width: 100%;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            overflow: hidden;
            background-color: #000000;
        }

        .news-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center;filter:brightness(.72);transition:transform .7s ease;display:block;max-width:none}
        @media(min-width:641px){.news-card:hover .news-bg{transform:scale(1.02)}}
        .news-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(8,9,11,.98) 0%,rgba(8,9,11,.68) 34%,rgba(8,9,11,.16) 70%,rgba(8,9,11,.04) 100%)}
        .img-failed{background:linear-gradient(135deg,#17131f,#090a0d)}
        @media(max-width:640px){
            .feed-container{height:100svh;height:100dvh;}
            .news-card{height:100svh;height:100dvh;width:100%;}
            /* Móvil: tarjeta de imagen cuadrada, grande y centrada */
            .news-bg{
                position:absolute;
                width:min(92vw,430px);
                height:min(92vw,430px);
                left:50%;
                top:7.5%;
                right:auto;
                bottom:auto;
                margin:0;
                transform:translateX(-50%) !important;
                object-fit:contain;
                object-position:center center;
                border-radius:14px;
                filter:brightness(.82);
                background:#050505;
                display:block;
                box-sizing:border-box;
            }
            .news-card:hover .news-bg{transform:translateX(-50%) !important;}
            .news-overlay{background:linear-gradient(to top,rgba(8,9,11,.99) 0%,rgba(8,9,11,.88) 25%,rgba(8,9,11,.18) 58%,rgba(8,9,11,0) 72%);}
        }
        
@media(min-width:641px) and (max-width:1100px){
            .news-bg{object-fit:cover;object-position:center center;}
        }
    
        /* Like: corazón negro con contorno blanco; al pulsar, corazón rojo */
        .gameflash-like-btn {
            background:#000 !important;
            border:2px solid #fff !important;
            color:#fff !important;
            box-shadow:none !important;
            transition:transform .15s ease, background-color .2s ease, color .2s ease;
        }
        .gameflash-like-btn.liked {
            background:#000 !important;
            border-color:#fff !important;
            color:#ef4444 !important;
        }
        .gameflash-like-btn:active { transform:scale(.92); }
        .gameflash-like-btn svg { width:22px; height:22px; display:block; }
        .gameflash-like-btn svg path { fill:currentColor; }

        /* ===== GameFlash: móvil 16:9 + texto debajo ===== */
        @media (max-width: 640px){
            .news-card{
                height:100svh;
                height:100dvh;
                width:100%;
                display:block;
                position:relative;
                overflow:hidden;
                scroll-snap-align:start;
            }

            .news-bg{
                position:absolute !important;
                top:calc(var(--gameflash-header-h, 112px) + 6px) !important;
                left:0 !important;
                right:auto !important;
                bottom:auto !important;
                width:100% !important;
                height:auto !important;
                aspect-ratio:16 / 9 !important;
                object-fit:cover !important;
                object-position:center center !important;
                transform:none !important;
                border-radius:0 !important;
                background:#050505;
                filter:brightness(.82);
                max-width:none !important;
                box-sizing:border-box;
            }

            .news-card:hover .news-bg{
                transform:none !important;
            }

            .news-overlay{
                top:calc(var(--gameflash-header-h, 112px) + 6px + 56.25vw) !important;
                bottom:0 !important;
                height:auto !important;
                background:linear-gradient(
                    to bottom,
                    rgba(8,9,11,.02) 0%,
                    rgba(8,9,11,.82) 10%,
                    rgba(8,9,11,.98) 32%,
                    rgba(8,9,11,1) 100%
                ) !important;
            }

            .news-card > .relative.z-10{
                position:absolute !important;
                top:calc(var(--gameflash-header-h, 112px) + 6px + 56.25vw + 14px) !important;
                left:0 !important;
                right:0 !important;
                bottom:auto !important;
                width:100% !important;
                max-width:none !important;
                padding:0 16px 24px !important;
                display:flex !important;
                flex-direction:column !important;
                gap:10px !important;
                z-index:10;
            }

            .news-card > .absolute.right-4{
                right:10px !important;
                bottom:24px !important;
                z-index:20 !important;
                transform:scale(.9);
                transform-origin:bottom right;
            }

            .news-card h2{
                font-size:clamp(1.15rem,5.4vw,1.55rem) !important;
                line-height:1.12 !important;
            }

            .news-card p{
                font-size:.82rem !important;
                line-height:1.42 !important;
                display:-webkit-box !important;
                -webkit-line-clamp:3 !important;
                -webkit-box-orient:vertical !important;
                overflow:hidden !important;
            }

            .news-card a{
                align-self:flex-start;
                max-width:calc(100% - 48px);
            }
        }


/* ===== GameFlash automatic news ===== */
.news-card.is-auto { min-height: 100dvh; }
.news-card.is-auto .news-bg { z-index:0; }
@media(max-width:640px){
  .news-card.is-auto .news-bg { top:calc(var(--gameflash-header-h,112px) + 6px) !important; width:100% !important; height:auto !important; aspect-ratio:16/9 !important; object-fit:cover !important; }
  .news-card.is-auto .news-overlay { top:calc(var(--gameflash-header-h,112px) + 6px + 56.25vw) !important; }
  .news-card.is-auto > .relative.z-10 { top:calc(var(--gameflash-header-h,112px) + 6px + 56.25vw + 14px) !important; }
}
</style>
</head>

(function(){
  function updateGameFlashHeaderHeight(){
    const header = document.querySelector('header');
    if (!header) return;
    document.documentElement.style.setProperty('--gameflash-header-h', header.getBoundingClientRect().height + 'px');
  }
  updateGameFlashHeaderHeight();
  window.addEventListener('resize', updateGameFlashHeaderHeight, {passive:true});
  window.addEventListener('orientationchange', function(){ setTimeout(updateGameFlashHeaderHeight, 100); }, {passive:true});
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(updateGameFlashHeaderHeight);
})();

<script>
const GAMEFLASH_HEART_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.2-4.35-9.45-8.1C.83 9.86 2.02 5.8 5.7 4.72c2.04-.6 4.1.16 5.3 1.86 1.2-1.7 3.26-2.46 5.3-1.86 3.68 1.08 4.87 5.14 3.15 8.18C19.2 16.65 12 21 12 21z"/></svg>';
function esc(v){const d=document.createElement('div'); d.textContent=v??''; return d.innerHTML;}
function getLikedIds(){try{return JSON.parse(localStorage.getItem('gameflash_likes')||'[]')}catch(e){return[]}}
function saveLikedIds(ids){localStorage.setItem('gameflash_likes',JSON.stringify(ids))}
function cardId(card){return card.dataset.likeId || (card.dataset.likeId='news-'+(card.dataset.newsId||Math.random().toString(36).slice(2)));}
function toggleLike(btn){const card=btn.closest('.news-card');const id=cardId(card);let ids=getLikedIds();if(ids.includes(id)){ids=ids.filter(x=>x!==id);btn.classList.remove('liked')}else{ids.push(id);btn.classList.add('liked')}saveLikedIds(ids);updateLikesUI()}
function updateLikesUI(){const ids=getLikedIds();const count=document.getElementById('likesCount');if(count)count.textContent=ids.length;document.querySelectorAll('.news-card').forEach(card=>{if(!card.dataset.newsId)return;const liked=ids.includes(cardId(card));const btn=card.querySelector('.gameflash-like-btn');if(btn)btn.classList.toggle('liked',liked)});if(typeof renderLikesList==='function')renderLikesList()}
function shareNews(url,title){const target=url||window.location.href;if(navigator.share){navigator.share({title:title||'GameFlash',text:'¡Mira esta noticia en GameFlash!',url:target}).catch(()=>{})}else{navigator.clipboard?.writeText(target);const toast=document.createElement('div');toast.textContent='¡Enlace copiado!';toast.className='fixed bottom-10 left-1/2 -translate-x-1/2 bg-purple-600 text-white px-4 py-2 rounded-xl text-xs font-semibold shadow-lg z-50';document.body.appendChild(toast);setTimeout(()=>toast.remove(),1600)}}
function renderLikesList(){const list=document.getElementById('likesList');if(!list)return;const ids=getLikedIds();const cards=[...document.querySelectorAll('.news-card[data-news-id]')];const liked=cards.filter(c=>ids.includes(cardId(c)));if(!liked.length){list.innerHTML='<div class="text-center text-zinc-400 text-sm py-12">Todavía no has dado like a ninguna noticia.<br><span class="text-xs">Pulsa ❤️ en una noticia para guardarla aquí.</span></div>';return}list.innerHTML=liked.map(c=>{const img=c.querySelector('.news-bg')?.src||'';const title=c.querySelector('h2')?.textContent||'Noticia';const desc=c.querySelector('p')?.textContent||'';const id=cardId(c);return `<button class="w-full text-left bg-white/5 hover:bg-white/10 border border-white/10 rounded-2xl p-3 flex gap-3 transition" onclick="openLikedNews('${esc(id)}')"><img src="${esc(img)}" class="w-24 h-16 object-cover rounded-xl bg-black"><span class="min-w-0"><span class="block text-[10px] uppercase text-purple-300 font-bold mb-1">Gaming</span><span class="block text-sm font-bold text-white line-clamp-2">${esc(title)}</span><span class="block text-[11px] text-zinc-400 line-clamp-1 mt-1">${esc(desc)}</span></span></button>`}).join('')}
function toggleLikesPanel(force){const p=document.getElementById('likesPanel');if(!p)return;const open=typeof force==='boolean'?force:p.classList.contains('hidden');p.classList.toggle('hidden',!open);if(open)renderLikesList()}

.stringify(n.title||'GameFlash')})'>🔗</button><span class="text-[10px] sm:text-xs font-semibold text-white drop-shadow">Compartir</span></div>`;return card;}
async function loadNews(){const feed=document.getElementById('feedContainer');try{const res=await fetch('news.json?ts='+Date.now(),{cache:'no-store'});if(!res.ok)throw new Error('news.json '+res.status);const news=await res.json();renderNews(news)}catch(e){console.warn('No se pudo leer news.json; usando noticias de respaldo.',e);try{const seed=document.getElementById('gameflashSeed');const news=JSON.parse(seed?.textContent||'[]');renderNews(news)}catch(err){console.error(err);const loading=document.getElementById('newsLoading');if(loading)loading.textContent='No se pudieron cargar las noticias.'}}}
function renderNews(news){const feed=document.getElementById('feedContainer');feed.innerHTML='';news.forEach((n,i)=>feed.appendChild(makeCard(n,i)));updateLikesUI();setupWheel()}
