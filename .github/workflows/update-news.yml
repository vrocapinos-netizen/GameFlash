- name: Instalar dependencias
  run: pip install googlenewsdecoder

- name: Actualizar noticias GameFlash
  run: python scripts/fetch_news.py
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Actualizar noticias
        run: python scripts/fetch_news.py

      - name: Guardar cambios
        run: |
          git config user.name "GameFlash Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then
            echo "No hay noticias nuevas."
          else
            git commit -m "Actualizar noticias GameFlash"
            git push
          fi
